version: 2

models:

  # ── 100-Bronze ──────────────────────────────────────────────────────────────

  - name: stg_transactions
    description: "Raw transactions loaded from CSV. No business logic."
    columns:
      - name: transaction_id
        description: "Natural key from source system"
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
      - name: direction
        tests:
          - accepted_values:
              arguments:
                values: ["Crédito", "Débito"]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["Completada", "Pendiente", "Rechazada"]

  - name: stg_accounts
    description: "Raw accounts loaded from CSV."
    columns:
      - name: account_id
        tests: [unique, not_null]
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ["Retail", "Premium", "Empresas", "Pyme"]

  - name: stg_products
    description: "Raw product catalog loaded from CSV."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_account_changes
    description: "Account attribute change events for SCD Type 2 processing."
    columns:
      - name: change_id
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]

  # ── 200-Silver ──────────────────────────────────────────────────────────────

  - name: dim_account
    description: >
      Account dimension with SCD Type 2. Each row is one version of an account.
      Use is_current = true for current state queries.
    columns:
      - name: account_key
        description: "MD5 surrogate key (account_id + valid_from)"
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: valid_from
        tests: [not_null]

  - name: dim_product
    description: >
      Product dimension with SCD Type 2 tracking rate changes.
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_date
    description: "Static calendar dimension covering 2022-2025."
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: date_day
        tests: [unique, not_null]

  # ── 300-Gold ────────────────────────────────────────────────────────────────

  - name: fact_transactions
    description: >
      Core fact table. Transaction grain. SCD2-aware joins to dim_account
      and dim_product. Only completed transactions included.
    columns:
      - name: transaction_key
        tests: [unique, not_null]
      - name: account_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]

  - name: mart_kpis
    description: >
      Monthly KPI mart aggregated by segment, branch and product category.
      Source of truth for financial reporting.

  - name: vw_dashboard
    description: >
      Flat pre-aggregated view optimized for Evidence.dev.
      One row per calendar month, all segments combined.
